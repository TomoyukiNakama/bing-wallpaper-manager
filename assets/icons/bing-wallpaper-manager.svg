<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Bing Wallpaper Manager のアイコン: 毎日の 1 枚（手前の写真）と、たまっていく過去の写真（後ろのカード） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D6A8E"/>
      <stop offset="1" stop-color="#18232A"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C77E"/>
      <stop offset="0.6" stop-color="#E9906C"/>
      <stop offset="1" stop-color="#BE6A7C"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA8C9"/>
      <stop offset="1" stop-color="#2D6A8E"/>
    </linearGradient>
    <clipPath id="photo">
      <rect x="62" y="70" width="132" height="98" rx="4"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>

  <!-- 過去の写真 -->
  <rect x="54" y="62" width="148" height="138" rx="10" fill="#E9EDEF" opacity="0.28" transform="rotate(-9 128 131)"/>

  <!-- 今日の写真 -->
  <rect x="54" y="62" width="148" height="138" rx="10" fill="#F6F8F9"/>
  <g clip-path="url(#photo)">
    <rect x="62" y="70" width="132" height="98" fill="url(#sky)"/>
    <circle cx="152" cy="106" r="15" fill="#FFF4DA"/>
    <path d="M62 140 L96 104 L117 124 L140 98 L194 146 L194 168 L62 168 Z" fill="#2D6A8E"/>
    <path d="M62 150 L100 130 L128 146 L158 132 L194 152 L194 168 L62 168 Z" fill="#1C2A33"/>
    <rect x="62" y="156" width="132" height="12" fill="url(#lake)" opacity="0.9"/>
  </g>
  <!-- 写真の下の余白（壁紙として選ぶカード） -->
  <rect x="74" y="179" width="58" height="7" rx="3.5" fill="#D3DADE"/>
  <circle cx="178" cy="182.5" r="7" fill="#2D6A8E"/>
</svg>
