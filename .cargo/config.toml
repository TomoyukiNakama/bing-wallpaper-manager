# gpui-kit（gpui-pre）は Ubuntu 標準の rustc 1.93 ではビルドできない（std::hint::cold_path が未対応）。
# `cargo` が /usr/bin/cargo のままでも rustup の stable を使わせるため、rustc 本体を直接指定する。
# rustup のプロキシ（~/.cargo/bin/rustc）にすると、依存クレートに同梱された rust-toolchain.toml
# （例: 1.83 指定）でクレートごとにバージョンが切り替わり、ビルドが壊れるので使わない。
[build]
rustc = "/home/tn/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/rustc"
