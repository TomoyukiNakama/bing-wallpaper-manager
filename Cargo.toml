[package]
name = "bing-wallpaper-manager"
version = "0.1.2"
edition = "2024"
description = "Ubuntu (GNOME) 向けの Bing 壁紙アプリ"
license = "MIT OR Apache-2.0"
authors = ["Tomoyuki Nakama"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gpui-kit = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }
