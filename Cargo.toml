[package]
name = "bing-wallpaper-manager"
version = "0.3.0"
edition = "2024"
description = "Ubuntu (GNOME) 向けの Bing 壁紙アプリ"
license = "MIT OR Apache-2.0"
authors = ["Tomoyuki Nakama"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
gpui-kit = "0.9.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }

# `cargo run`（debug ビルド）でも依存ライブラリは最適化する。
# 最適化しないと UHD 画像のデコードに 1 枚 2 秒ほどかかり、写真の切り替えが遅れる（最適化すると 0.04 秒ほど）。
# このアプリ自身のコードは最適化しないので、変更後の再ビルドの速さとデバッグのしやすさは変わらない。
[profile.dev.package."*"]
opt-level = 3
